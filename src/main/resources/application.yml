server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: muxcraft
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/muxcraft?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    date-format: yyyy-MM-dd HH:mm
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.muxcraft.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: MuXCraft-Digital-Workshop-JWT-Secret-Key-2026-Please-Change-In-Production
  expire-seconds: 7200

# CORS 跨域配置（生产环境设置为前端 HTTPS 域名，多个用逗号分隔）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:90,http://127.0.0.1:90}

# 阿里云 OSS 配置（生产环境请替换为实际值）
aliyun:
  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket-name: muxcraft

# 文件上传配置
file:
  # 上传方式：oss（阿里云OSS）或 local（本地存储）
  upload-type: ${FILE_UPLOAD_TYPE:oss}
  # 本地存储目录（Ubuntu 生产环境建议 /www/wwwroot/muxcraft/uploads）
  local-path: ${FILE_LOCAL_PATH:/www/wwwroot/muxcraft/uploads}
  # 本地存储访问域名前缀（前端通过此 URL 访问本地存储的图片）
  local-url-base: ${FILE_LOCAL_URL_BASE:https://muxcraft.cfd}
  # OSS 访问域名（自定义域名或 bucket 默认域名，含 https://）
  oss-domain: ${OSS_DOMAIN:}

logging:
  level:
    com.muxcraft: debug